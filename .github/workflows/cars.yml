name: cars-digest

on:
  schedule:
    # время указано в UTC; Минск = UTC+3, поэтому запуски в 09:05, 12:05, 17:05 и 21:05 по Минску
    - cron: "5 6,9,14,18 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Отправить тестовые ДЕМО-машины"
        type: boolean
        default: false
      dry:
        description: "Только показать выбор в логах, ничего не отправлять"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cars-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Europe/Minsk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py ${{ inputs.demo && '--demo' || '' }} ${{ inputs.dry && '--dry' || '' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Save state
        if: always()
        run: |
          git config user.name "cars-bot"
          git config user.email "cars-bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet || git commit -m "update state"
          git push || (git pull --rebase && git push)
