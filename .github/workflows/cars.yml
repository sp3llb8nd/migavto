name: cars-digest

on:
  schedule:
    # Время в UTC; Минск = UTC+3.
    - cron: "35 4,10 * * *"      # 07:35 и 13:35 по Минску: сбор объявлений с площадок, у которых подошёл срок
    - cron: "*/15 5-19 * * *"    # каждые 15 минут с 08:00 до 22:45 по Минску: публикация по очереди
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        type: choice
        default: status
        options:
          - status      # показать очередь и ошибки
          - publish     # опубликовать, если подошло время
          - fetch-all   # собрать со всех площадок и поставить в очередь
          - dry         # собрать и показать отбор, ничего не сохранять
          - demo        # 3 тестовых поста

permissions:
  contents: write

concurrency:
  group: cars-digest            # один запуск за раз: сбор и публикация не идут параллельно
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Minsk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        run: >-
          python main.py --${{ github.event_name == 'workflow_dispatch' && inputs.mode
          || (github.event.schedule == '35 4,10 * * *' && 'fetch' || 'publish') }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Save state
        if: always()
        run: |
          git config user.name "cars-bot"
          git config user.email "cars-bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
